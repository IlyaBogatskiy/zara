server:
  port: 8100
---
telegram:
  token: ${TELEGRAM_BOT_TOKEN:8246166840:AAFbWry69EED8IEX3hUbL76kO4vW19SR_fQ}
---
zara:
  monitor:
    period-ms: 30000   # 30s: halves notification latency (with debounce=2, ~30-60s vs ~60-120s); scrape load stays light (~9 products x ~0.5s API per 30s)
    confirmations: 2                 # debounce: agreeing observations required before a change is committed/notified
    burst-confirm: true              # on a watched change, fetch the confirming observation now (fast re-scrape) instead of waiting a full period
    burst-confirm-delay-ms: 3000     # pause before the confirming re-scrape (tune on prod)
    burst-confirm-max-per-tick: 3    # cap burst re-scrapes per tick; the rest fall back to cross-tick debounce
  api:
    enabled: true       # fast JSON path; false — Selenium only
  driver:
    wait-seconds: 15
    remote-url: ${ZARA_DRIVER_REMOTE_URL:}   # Selenium Grid URL; blank = local ChromeDriver
  canary:
    enabled: true       # periodic Selenium-vs-API cross-check
    initial-delay-ms: 600000   # first run 10 minutes after startup
    period-ms: 21600000        # then every 6 hours
  admin-chat-id: ${ZARA_ADMIN_CHAT_ID:0}   # operator chatId for alerts; 0 = log only
---
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zara_bot}
    username: ${DB_USERNAME:zara}
    password: ${DB_PASSWORD:zara_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # dev only; switch to validate in production
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  sql:
    init:
      mode: never

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
