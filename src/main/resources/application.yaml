telegram:
  token: ${TELEGRAM_BOT_TOKEN:8246166840:AAFbWry69EED8IEX3hUbL76kO4vW19SR_fQ}
---
zara:
  monitor:
    period-ms: 30000   # 30s: halves notification latency (with debounce=2, ~30-60s vs ~60-120s); scrape load stays light (~9 products x ~0.5s API per 30s)
    confirmations: 2                 # debounce: agreeing observations required before a change is committed/notified
    burst-confirm: true              # on a watched change, fetch the confirming observation now (fast re-scrape) instead of waiting a full period
    burst-confirm-delay-ms: 3000     # pause before the confirming re-scrape (tune on prod)
    burst-confirm-max-per-tick: 3    # cap burst re-scrapes per tick; the rest fall back to cross-tick debounce
    anti-flap-cooldown-ticks: 3      # after a size flips, bar it from burst for N ticks; an opposite flip within N ticks = a flap -> quarantine (0 disables anti-flap)
    flap-quarantine-ticks: 60        # once flapping, mute a size's restocks for N ticks (~30 min at 30s period) -> at most one false pair, then quiet
    stall-alert-ms: 300000           # resuming tick alerts admin if the gap since the last tick exceeds this (~monitoring outage); 0 disables
    slow-tick-alert-ms: 15000        # alert admin (throttled) when a single tick exceeds this — usually a blocking Selenium fallback; 0 disables
  api:
    enabled: true       # fast JSON path; false — Selenium only
  driver:
    wait-seconds: 15
    remote-url: ${ZARA_DRIVER_REMOTE_URL:}   # Selenium Grid URL; blank = local ChromeDriver
  canary:
    enabled: true       # periodic Selenium-vs-API cross-check
    initial-delay-ms: 600000   # first run 10 minutes after startup
    period-ms: 21600000        # then every 6 hours
  log-digest:
    enabled: true            # collect WARN/ERROR all day, send once daily to the admin chat (nothing on a clean day)
    cron: "0 55 23 * * *"    # 23:55 daily — end of day
    zone: ""                 # blank = JVM default zone
    max-entries: 5000        # ring-buffer cap; older WARN/ERROR dropped (count reported in the digest)
  admin-chat-id: ${ZARA_ADMIN_CHAT_ID:0}   # operator chatId for alerts + daily log digest; 0 = log only
---
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zara_bot}
    username: ${DB_USERNAME:zara}
    password: ${DB_PASSWORD:zara_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # dev only; switch to validate in production
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  sql:
    init:
      mode: never

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
