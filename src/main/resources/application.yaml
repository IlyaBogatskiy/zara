server:
  port: 8100
---
telegram:
  token: ${TELEGRAM_BOT_TOKEN}   # required; set via env / .env — no committed default (rotate any previously committed token)
---
zara:
  monitor:
    period-ms: 30000   # 30s: halves notification latency (with debounce=2, ~30-60s vs ~60-120s); scrape load stays light (~9 products x ~0.5s API per 30s)
    confirmations: 2                 # debounce: agreeing observations required before a change is committed/notified
    burst-confirm: true              # on a watched change, fetch the confirming observation now (fast re-scrape) instead of waiting a full period
    burst-confirm-delay-ms: 3000     # pause before the confirming re-scrape (tune on prod)
    burst-confirm-max-per-tick: 3    # cap burst re-scrapes per tick; the rest fall back to cross-tick debounce
    anti-flap-cooldown-ticks: 3      # after a size flips, bar it from burst for N ticks; an opposite flip within N ticks = a flap -> quarantine (0 disables anti-flap)
    flap-quarantine-ticks: 60        # once flapping, mute a size's restocks for N ticks (~30 min at 30s period) -> at most one false pair, then quiet
    stall-alert-ms: 300000           # resuming tick alerts admin if the gap since the last tick exceeds this (~monitoring outage); 0 disables
    slow-tick-alert-ms: 15000        # alert admin (throttled) when a single tick exceeds this — usually a blocking Selenium fallback; 0 disables
    scan-threads: 4                  # products scraped concurrently per tick (bounds parallel Chrome on Selenium fallback); 1 = single-threaded scan
  api:
    enabled: true       # fast JSON path; false — Selenium only
    cache-bust: true    # append a unique param so Akamai returns FRESH data, not its ~9-min edge cache (fixes late restock alerts); false = allow caching
    degraded-window: 20      # sliding window of recent API attempts for the degradation watchdog; 0 disables
    degraded-threshold: 0.5  # fallback-to-Selenium rate over the window that triggers an admin alert
    breaker-trip-threshold: 2    # circuit breaker: skip the API (straight to Selenium) after N consecutive API failures; 0 disables
    breaker-cooldown-ms: 120000  # stay on Selenium this long before re-probing the API once (recovers automatically)
  driver:
    wait-seconds: 15
    page-load-timeout-seconds: 20   # hard cap on driver.get(); fails a hung scrape fast instead of blocking the scheduler ~300s. 0 = driver default
    remote-url: ${ZARA_DRIVER_REMOTE_URL:}   # Selenium Grid URL; blank = local ChromeDriver
  canary:
    enabled: true       # periodic Selenium-vs-API cross-check
    initial-delay-ms: 600000   # first run 10 minutes after startup
    period-ms: 21600000        # then every 6 hours
  activity-summary:
    enabled: true            # daily "how the bot lived" report to the admin chat (footprint + event counts)
    cron: "0 0 9 * * *"      # 09:00 daily
    zone: ""                 # blank = JVM default zone
  log-digest:
    enabled: true            # collect WARN/ERROR all day, send once daily to the admin chat (nothing on a clean day)
    cron: "0 55 23 * * *"    # 23:55 daily — end of day
    zone: ""                 # blank = JVM default zone
    max-entries: 5000        # ring-buffer cap; older WARN/ERROR dropped (count reported in the digest)
  admin-chat-id: ${ZARA_ADMIN_CHAT_ID:0}   # operator chatId for alerts + daily log digest; 0 = log only
  selectors:                 # Selenium-fallback CSS selectors — hotfix a Zara DOM change here without recompiling
    product-name: "h1[data-qa-qualifier='product-detail-info-name']"
    add-to-cart: "button[data-qa-action='add-to-cart']"
    view-similar: "button[data-qa-action='show-similar-products']"
    size-row: "ul.size-selector-sizes > li"
    size-label: "div[data-qa-qualifier='size-selector-sizes-size-label']"
    size-button: "button[data-qa-action^='size-']"
    cookie-accept: "button#onetrust-accept-btn-handler"
    price-current: "[data-qa-qualifier='price-amount-current'], .price__amount--current .money-amount__main"
    in-stock-marker: "in-stock"   # substring in the size button's data-qa-action that means in stock
---
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zara_bot}
    username: ${DB_USERNAME:zara}
    password: ${DB_PASSWORD:zara_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:validate}   # prod-safe default; dev/docker set DB_DDL_AUTO=update to auto-create, tests use create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  sql:
    init:
      mode: never

logging:
  level:
    org.hibernate.SQL: warn                # was debug — SQL statement logging is ~70% of log volume; raise to debug locally to see queries
    org.hibernate.orm.jdbc.bind: warn      # was trace — bound-parameter values are ~25% of volume and leak data (chat ids, keys); keep off in prod
